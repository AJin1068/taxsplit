name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # eval/ 벽은 guard.yml(main 설정으로 도는 pull_request_target)로 옮겼다 (ADR-0008 갱신).
  agent:
    name: agent (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

