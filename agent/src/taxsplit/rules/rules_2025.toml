# 2025년 귀속 규칙표. 계산 엔진(PR 4·5)은 세법 숫자를 코드에 쓰지 않고 이 표에서 읽는다(NFR-05).
#
# 책자: 국세청 「2025년 귀속 원천징수의무자를 위한 연말정산 신고안내」(2025.12 발간, 정오표 2026.02.03)
# 쪽수: 인쇄 쪽 "p94". 쪽 번호가 없는 앞쪽 요약은 "PDF 6쪽". (PDF 쪽 = 인쇄 쪽 + 18)
#
# 칸:
#   id       2025.<그룹>.<이름>. 한 번 정하면 바꾸지 않는다(PR 4~6 결과, PR 13 근거 검색이 이 ID를 쓴다)
#   group    base(계산 기본 흐름), dependent, child, medical, education, card
#   statute  근거 조문(책자 각 절 제목에 적힌 것). 예규는 예규 번호
#   status   sourced = 쪽수와 조문이 모두 있음 / todo = 확인할 것이 남음(todo 칸에 이유)
#   value    금액은 원 단위 정수, 비율은 "0.15"처럼 문자열(로더가 Decimal로 바꾼다)
#   구간표   over = 이 금액을 "넘는" 구간, base + (금액 - over) × rate

# ── 계산 기본 흐름 ─────────────────────────────────────────────

[[rule]]
id = "2025.base.earned_income_deduction"
year = 2025
group = "base"
summary = "근로소득공제 5구간(70%/40%/15%/5%/2%), 한도 2,000만원"
statute = "소법 §47"
pages = ["p94", "p214"]
status = "sourced"
[rule.value]
limit = 20_000_000
brackets = [
  { over = 0, base = 0, rate = "0.70" },
  { over = 5_000_000, base = 3_500_000, rate = "0.40" },
  { over = 15_000_000, base = 7_500_000, rate = "0.15" },
  { over = 45_000_000, base = 12_000_000, rate = "0.05" },
  { over = 100_000_000, base = 14_750_000, rate = "0.02" },
]

[[rule]]
id = "2025.base.tax_rate"
year = 2025
group = "base"
summary = "기본세율 8구간(6%~45%)"
# 조문 근거: p92 외국인근로자 과세특례 문단 "「소득세법」 제55조 제1항에도 불구하고" (2026-11-17 기획 확인)
statute = "소법 §55 ①"
pages = ["PDF 6쪽", "p92"]
status = "sourced"
[rule.value]
brackets = [
  { over = 0, base = 0, rate = "0.06" },
  { over = 14_000_000, base = 840_000, rate = "0.15" },
  { over = 50_000_000, base = 6_240_000, rate = "0.24" },
  { over = 88_000_000, base = 15_360_000, rate = "0.35" },
  { over = 150_000_000, base = 37_060_000, rate = "0.38" },
  { over = 300_000_000, base = 94_060_000, rate = "0.40" },
  { over = 500_000_000, base = 174_060_000, rate = "0.42" },
  { over = 1_000_000_000, base = 384_060_000, rate = "0.45" },
]

[[rule]]
id = "2025.base.earned_income_tax_credit"
year = 2025
group = "base"
summary = "근로소득세액공제: 산출세액 130만원 이하 55%, 초과분 30%"
statute = "소법 §59"
pages = ["p162"]
status = "sourced"
[rule.value]
# 기준 금액은 산출세액
brackets = [
  { over = 0, base = 0, rate = "0.55" },
  { over = 1_300_000, base = 715_000, rate = "0.30" },
]

[[rule]]
id = "2025.base.earned_income_tax_credit.limit"
year = 2025
group = "base"
summary = "근로소득세액공제 한도: 총급여 구간별 74만/66만/50만/20만원"
statute = "소법 §59"
pages = ["p162"]
status = "sourced"
[rule.value]
# 기준 금액은 총급여. 한도 = max(floor, base - (총급여 - over) × slope)
segments = [
  { over = 0, base = 740_000, slope = "0.0", floor = 740_000 },
  { over = 33_000_000, base = 740_000, slope = "0.008", floor = 660_000 },
  { over = 70_000_000, base = 660_000, slope = "0.5", floor = 500_000 },
  { over = 120_000_000, base = 500_000, slope = "0.5", floor = 200_000 },
]

[[rule]]
id = "2025.base.combined_deduction_limit"
year = 2025
group = "base"
summary = "소득공제 종합한도 2,500만원(5그룹 중 카드 소득공제가 대상)"
statute = "조특법 §132의2"
pages = ["p147"]
status = "sourced"
[rule.value]
limit = 25_000_000

[[rule]]
id = "2025.base.standard_tax_credit"
year = 2025
group = "base"
summary = "표준세액공제 13만원: 특별소득공제·특별세액공제·월세액세액공제를 신청하지 않으면 적용. 부부는 각자 받는 공제와 비교해 큰 쪽을 고른다"
statute = "소법 §59의4 ⑨"
pages = ["p170"]
status = "sourced"
[rule.value]
amount = 130_000
# 이 셋 중 하나라도 신청하면 표준세액공제는 받지 않는다
applies_when_none_of = ["special_income_deduction", "special_tax_credit", "monthly_rent_credit"]
# 부부 각자 따로 판단: 특별공제 합계와 13만원 중 큰 쪽
per_person_choose_larger = true

[[rule]]
id = "2025.base.pension_insurance_deduction"
year = 2025
group = "base"
summary = "연금보험료공제: 근로자 본인이 낸 국민연금 보험료 전액(사용자 부담금 제외). 공제 합계가 종합소득금액을 넘으면 넘는 부분은 없는 것으로 본다"
statute = "소법 §51의3"
pages = ["p103"]
status = "sourced"
[rule.value]
# 근로자 본인 부담분만 공제
payer = "employee"
# 소득공제 합계가 종합소득금액을 넘는 부분은 공제하지 않는다
excess_over = "comprehensive_income_amount"

[[rule]]
id = "2025.base.insurance_premium_deduction"
year = 2025
group = "base"
summary = "보험료공제(특별소득공제): 근로자가 부담한 국민건강보험·고용보험·노인장기요양보험 보험료 전액"
statute = "소법 §52 ①"
pages = ["p107"]
status = "sourced"
[rule.value]
payer = "employee"
items = ["national_health", "employment", "long_term_care"]

[[rule]]
id = "2025.base.rounding"
year = 2025
group = "base"
summary = "단계 값(원천징수영수증에 적는 금액)은 원 미만을 버린다. 10원·100원 단위로는 버리지 않는다"
statute = "소득세법 시행규칙 별지 제24호서식(1) 작성방법 15"
pages = ["p242"]
status = "sourced"
[rule.value]
unit = 1
mode = "floor"

# ── 부양가족(인적공제) ─────────────────────────────────────────

[[rule]]
id = "2025.dependent.basic"
year = 2025
group = "dependent"
summary = "기본공제 1명당 150만원, 소득요건 연 100만원(근로소득만 있으면 총급여 500만원) 이하, 나이요건(직계존속 60세 이상, 직계비속 20세 이하, 형제자매 20세 이하·60세 이상, 장애인은 나이 제한 없음)"
statute = "소법 §50"
pages = ["PDF 8쪽", "p95", "p96", "p102"]
status = "sourced"
[rule.value]
amount = 1_500_000
income_limit = 1_000_000
wage_only_gross_limit = 5_000_000
# 나이요건 (PDF 8쪽 요건표, p96). 판정 방법은 2025.dependent.judgment_date
lineal_ascendant_min_age = 60
lineal_descendant_max_age = 20
sibling_max_age = 20
sibling_min_age = 60
disabled_no_age_limit = true

[[rule]]
id = "2025.dependent.additional.elderly"
year = 2025
group = "dependent"
summary = "경로우대 추가공제: 70세 이상 1명당 100만원"
statute = "소법 §51"
pages = ["p95", "p97"]
status = "sourced"
[rule.value]
amount = 1_000_000
min_age = 70

[[rule]]
id = "2025.dependent.additional.disabled"
year = 2025
group = "dependent"
summary = "장애인 추가공제: 1명당 200만원"
statute = "소법 §51"
pages = ["p95", "p97"]
status = "sourced"
[rule.value]
amount = 2_000_000

[[rule]]
id = "2025.dependent.additional.woman"
year = 2025
group = "dependent"
summary = "부녀자 추가공제 50만원: 종합소득금액 3천만원 이하 여성으로, 배우자가 있거나 배우자 없이 기본공제대상 부양가족이 있는 세대주"
statute = "소법 §51"
pages = ["PDF 8쪽", "p95", "p97", "p99"]
status = "sourced"
[rule.value]
amount = 500_000
income_limit = 30_000_000
# 둘 중 하나면 된다 (PDF 8쪽, p99 ①②)
requires_any = ["has_spouse", "single_head_of_household_with_dependent"]

[[rule]]
id = "2025.dependent.additional.single_parent"
year = 2025
group = "dependent"
summary = "한부모 추가공제 100만원, 부녀자공제와 중복이면 한부모 우선"
statute = "소법 §51"
pages = ["p95", "p97", "p99"]
status = "sourced"
[rule.value]
amount = 1_000_000
excludes = "2025.dependent.additional.woman"

[[rule]]
id = "2025.dependent.judgment_date"
year = 2025
group = "dependent"
summary = "공제대상 판정은 12/31 현재, 사망·치유자는 그 전날. 나이는 연중 하루라도 해당하면 인정"
statute = "소법 §53"
pages = ["p99", "p100"]
status = "sourced"
[rule.value]
month_day = "12-31"
deceased_or_cured = "day_before"
age = "any_day_in_year"

[[rule]]
id = "2025.dependent.double_claim"
year = 2025
group = "dependent"
summary = "둘 이상 거주자의 공제대상 가족이면 그중 1명에게만"
statute = "소령 §106"
pages = ["p100"]
status = "sourced"
[rule.value]
max_claimants = 1

[[rule]]
id = "2025.dependent.additional.claimant"
year = 2025
group = "dependent"
summary = "맞벌이 부부: 추가공제(경로우대·장애인·부녀자·한부모)는 그 부양가족을 기본공제 받은 근로자가 받는다"
# 조문은 추가공제 절(p97)의 조문. 근거 문장은 p389 부록 4 "맞벌이 부부 연말정산"
statute = "소법 §51"
pages = ["p389"]
status = "sourced"
[rule.value]
eligible_claimant = "basic_deduction_claimant"

# ── 자녀세액공제 ───────────────────────────────────────────────

[[rule]]
id = "2025.child.credit.base"
year = 2025
group = "child"
summary = "8세 이상 자녀 1명 25만, 2명 55만, 3명 이상 55만원 + 2명 초과 1명당 40만원"
# 3명 이상 추가액 40만원은 법률 제20615호가 30만원 → 40만원으로 바꾼 값.
# 책자 p217 괄호의 30만원은 개정 전 값(PR #54 검증 코멘트, law.go.kr lsiSeq=267581)
statute = "소법 §59의2 ①3호 (법률 제20615호, 2025.1.1 시행)"
pages = ["p164", "PDF 6쪽"]
status = "sourced"
[rule.value]
min_age = 8
one = 250_000
two = 550_000
extra_per_child_over_two = 400_000

[[rule]]
id = "2025.child.credit.birth"
year = 2025
group = "child"
summary = "출산·입양 첫째 30만, 둘째 50만, 셋째 이상 70만원"
statute = "소법 §59의2"
pages = ["p164"]
status = "sourced"
[rule.value]
first = 300_000
second = 500_000
third_or_more = 700_000

# ── 의료비 ─────────────────────────────────────────────────────

[[rule]]
id = "2025.medical.threshold"
year = 2025
group = "medical"
summary = "의료비는 총급여 3% 초과분부터"
statute = "소법 §59의4 ②"
pages = ["p173"]
status = "sourced"
[rule.value]
gross_rate = "0.03"

[[rule]]
id = "2025.medical.rate"
year = 2025
group = "medical"
summary = "의료비 공제율 15%, 미숙아·선천성이상아 20%, 난임시술비 30%"
statute = "소법 §59의4 ②"
pages = ["p173"]
status = "sourced"
[rule.value]
general = "0.15"
premature_congenital = "0.20"
infertility = "0.30"

[[rule]]
id = "2025.medical.limit.others"
year = 2025
group = "medical"
summary = "그 외 부양가족 연 700만원 한도, 본인·65세 이상·6세 이하·장애인 등은 한도 없음"
statute = "소법 §59의4 ②"
pages = ["p169", "p173"]
status = "sourced"
[rule.value]
limit = 7_000_000
# unlimited의 age_65_plus·age_6_or_under 나이 경계(요약 문장의 "65세 이상·6세 이하")
age_65_plus_min_age = 65
age_6_or_under_max_age = 6
unlimited = [
  "self",
  "age_65_plus",
  "age_6_or_under",
  "disabled",
  "premature_congenital",
  "health_insurance_special_case",
  "infertility",
]

[[rule]]
id = "2025.medical.threshold_order"
year = 2025
group = "medical"
summary = "총급여 3% 문턱은 그 외 부양가족 의료비(㉣)에서 먼저 빼고, 모자라면 본인·65세 이상·6세 이하·장애인 등(㉢) → 미숙아·선천성이상아(㉡) → 난임시술비(㉠) 순서로 뺀다"
# 근거: p173 표 "가~라" (Issue #14 정해진 결정 "의료비 문턱 빼는 순서")
statute = "소법 §59의4 ②"
pages = ["p173"]
status = "sourced"
[rule.value]
# others = ㉣, special = ㉢, premature_congenital = ㉡, infertility = ㉠
order = ["others", "special", "premature_congenital", "infertility"]

[[rule]]
id = "2025.medical.sublimit"
year = 2025
group = "medical"
summary = "안경 1인당 50만원, 산후조리원 출산 1회당 200만원"
statute = "소법 §59의4 ②"
pages = ["p169", "PDF 6쪽"]
status = "todo"
todo = "TODO(확인 필요): 세부 한도의 시행령 조문 확인 전"
[rule.value]
glasses_per_person = 500_000
postnatal_care_per_birth = 2_000_000

[[rule]]
id = "2025.medical.couple_rule"
year = 2025
group = "medical"
summary = "맞벌이 부부: 부양가족 의료비는 그 가족을 기본공제 받은 쪽이 지출한 것만 공제"
statute = "재소득-649 (2006.10.24.)"
# p177 예규는 자녀만 말한다. 배우자 외 부양가족 전체로 넓힌 근거는 p389 부록 4
pages = ["p177", "p389"]
status = "sourced"
[rule.value]
eligible_payer = "basic_deduction_claimant"

[[rule]]
id = "2025.medical.spouse_expense"
year = 2025
group = "medical"
summary = "맞벌이 부부: 소득이 있는 배우자를 위해 지출한 의료비는 지출한 본인이 공제(부양가족 의료비는 2025.medical.couple_rule)"
# 조문은 의료비 절(p173)의 조문. 근거 문장은 p389 부록 4
statute = "소법 §59의4 ②"
pages = ["p389"]
status = "sourced"
[rule.value]
income_spouse_expense_claimant = "payer"

# ── 교육비 ─────────────────────────────────────────────────────

[[rule]]
id = "2025.education.rate"
year = 2025
group = "education"
summary = "교육비 공제율 15%"
statute = "소법 §59의4 ③"
pages = ["p169", "p178"]
status = "sourced"
[rule.value]
rate = "0.15"

[[rule]]
id = "2025.education.limit"
year = 2025
group = "education"
summary = "취학 전·초중고 1명당 300만, 대학생 900만원, 본인·장애인 한도 없음"
statute = "소법 §59의4 ③"
pages = ["p169", "p178"]
status = "sourced"
[rule.value]
preschool = 3_000_000
school = 3_000_000
university = 9_000_000
unlimited = ["self", "disabled_rehab"]

[[rule]]
id = "2025.education.graduate_self_only"
year = 2025
group = "education"
summary = "대학원 교육비는 근로자 본인 것만 공제한다(부양가족의 대학원 교육비는 대상 아님)"
# 근거: p185 교육비 사례 풀이에서 대학원생 처남 교육비를 대상에서 뺌. p178 쪽 대조는 기획 확인 대기(Issue #14 [계획] 정할 것 1)
statute = "소법 §59의4 ③"
pages = ["p185"]
status = "sourced"
[rule.value]
levels = ["graduate"]
eligible = ["self"]

[[rule]]
id = "2025.education.sublimit"
year = 2025
group = "education"
summary = "체험학습비 연 30만원, 교복 중고생 연 50만원"
statute = "소법 §59의4 ③"
pages = ["p169", "p178"]
status = "sourced"
[rule.value]
field_trip_per_year = 300_000
uniform_middle_high_per_year = 500_000

[[rule]]
id = "2025.education.excluded_persons"
year = 2025
group = "education"
summary = "공제 안 되는 교육비: 맞벌이(소득이 있는) 배우자를 위해 지출한 교육비, 직계존속 교육비(장애인특수교육비는 예외)"
statute = "소법 §59의4 ③"
pages = ["p180", "p185", "p389"]
status = "sourced"
[rule.value]
excluded = ["spouse_with_income", "lineal_ascendant"]
# 직계존속이라도 장애인특수교육비는 공제된다
lineal_ascendant_exception = ["disabled_special_education"]

# ── 신용카드 등 ────────────────────────────────────────────────

[[rule]]
id = "2025.card.threshold"
year = 2025
group = "card"
summary = "카드 등 사용금액이 총급여 25%를 넘는 부분부터"
statute = "조특법 §126의2"
pages = ["p132"]
status = "sourced"
[rule.value]
gross_rate = "0.25"

[[rule]]
id = "2025.card.rate"
year = 2025
group = "card"
summary = "신용 15%, 현금영수증·체크 30%, 문화체육(총급여 7천만원 이하) 30%, 전통시장 40%, 대중교통 40%"
statute = "조특법 §126의2"
pages = ["p132"]
status = "sourced"
[rule.value]
credit = "0.15"
cash_debit = "0.30"
culture = "0.30"
culture_gross_limit = 70_000_000
market = "0.40"
transit = "0.40"

[[rule]]
id = "2025.card.min_usage_order"
year = 2025
group = "card"
summary = "최저사용금액은 신용카드분 → 현금·체크·문화체육 → 전통시장·대중교통 순서로 채운다(⑥ 계산식)"
statute = "조특법 §126의2"
pages = ["p133"]
status = "sourced"
[rule.value]
order = ["credit", "cash_debit_culture", "market_transit"]

[[rule]]
id = "2025.card.limit"
year = 2025
group = "card"
summary = "기본 한도: 총급여 7천만원 이하 300만원, 초과 250만원"
statute = "조특법 §126의2"
pages = ["p132"]
status = "sourced"
[rule.value]
gross_split = 70_000_000
at_or_below = 3_000_000
above = 2_500_000

[[rule]]
id = "2025.card.additional_limit"
year = 2025
group = "card"
summary = "추가 한도 300만원(총급여 7천만원 초과 200만원, 문화체육 제외)"
statute = "조특법 §126의2"
pages = ["p133"]
status = "sourced"
[rule.value]
gross_split = 70_000_000
at_or_below = 3_000_000
above = 2_000_000
culture_excluded_above = true

[[rule]]
id = "2025.card.user_basis"
year = 2025
group = "card"
summary = "형제자매가 쓴 카드 등 사용금액은 기본공제대상자여도 제외. 맞벌이 부부의 가족카드는 결제자가 아니라 사용자 기준"
statute = "조특법 §126의2"
pages = ["p134", "p389"]
status = "sourced"
[rule.value]
excluded_relations = ["sibling"]
family_card_basis = "user"

[[rule]]
id = "2025.card.culture_over_limit"
year = 2025
group = "card"
summary = "총급여 7천만원 초과자의 문화체육 사용분은 결제 수단 공제율(신용 15%, 현금·체크 30%)로 계산하고, 최저사용금액 채우는 순서도 결제 수단을 따른다"
statute = "조특법 §126의2"
pages = ["p132", "p133"]
status = "sourced"
[rule.value]
# 2025.card.rate의 culture_gross_limit과 같은 값이어야 한다(테스트가 확인)
gross_limit = 70_000_000
rate_by = "payment_method"
min_usage_by = "payment_method"

[[rule]]
id = "2025.card.rounding"
year = 2025
group = "card"
summary = "카드 공제 계산의 끝수: 원 미만만 버린다. 10원·100원 단위로는 버리지 않는다(원천징수영수증 서식에 적는 금액)"
# 근거: p238~p242 근로소득 원천징수영수증 서식 작성방법 15 "그 외는 소수점 이하 값만 버리며" (Issue #14 정해진 결정, 2026-11-18 기획 확인)
statute = "소득세법 시행규칙 별지 제24호서식(1) 작성방법 15"
pages = ["p242"]
status = "sourced"
[rule.value]
unit = 1
mode = "floor"
# 카드 계산의 모든 단계 값(① ~ ⑥, 공제가능금액, 한도)에 적용
stages = ["all"]
