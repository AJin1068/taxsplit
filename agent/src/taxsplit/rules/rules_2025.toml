statute = "소법 §59의4 ③"
pages = ["p169", "p178"]
status = "sourced"
[rule.value]
preschool = 3_000_000
school = 3_000_000
university = 9_000_000
unlimited = ["self", "disabled_rehab"]

[[rule]]
id = "2025.education.graduate_self_only"
year = 2025
group = "education"
summary = "대학원 교육비는 근로자 본인 것만 공제한다(부양가족의 대학원 교육비는 대상 아님)"
# 근거: p180 교육비 한도 표("대학원생 ⇒ 공제대상 아님", 본인은 대학원 포함 전액),
# p185 사례 풀이(대학원생 처남 교육비 제외). PR 5 [기획 확인] 1번
statute = "소법 §59의4 ③"
pages = ["p180", "p185"]
status = "sourced"
[rule.value]
levels = ["graduate"]
eligible = ["self"]

[[rule]]
id = "2025.education.sublimit"
year = 2025
group = "education"
summary = "체험학습비 연 30만원, 교복 중고생 연 50만원"
statute = "소법 §59의4 ③"
pages = ["p169", "p178"]
status = "sourced"
[rule.value]
field_trip_per_year = 300_000
uniform_middle_high_per_year = 500_000

[[rule]]
id = "2025.education.excluded_persons"
year = 2025
group = "education"
summary = "공제 안 되는 교육비: 맞벌이(소득이 있는) 배우자를 위해 지출한 교육비, 직계존속 교육비(장애인특수교육비는 예외)"
statute = "소법 §59의4 ③"
pages = ["p180", "p185", "p389"]
status = "sourced"
[rule.value]
excluded = ["spouse_with_income", "lineal_ascendant"]
# 직계존속이라도 장애인특수교육비는 공제된다
lineal_ascendant_exception = ["disabled_special_education"]

[[rule]]
id = "2025.education.couple_rule"
year = 2025
group = "education"
summary = "맞벌이 부부: 부양가족 교육비는 그 가족을 기본공제 받은 쪽이 지출한 것만 공제(의료비 2025.medical.couple_rule과 같음)"
# 근거: p389 부록 4 표의 의료비·교육비 "배우자 외 부양가족" 칸이 한 칸으로 합쳐져
# "부부 중 부양가족을 기본공제 받는 근로자가 부양가족을 위해 지출한 금액 공제". p181 예규 원천-361.
# PR 6 [기획 확인] 2번, Issue #15 정해진 결정(2026-11-19)
statute = "원천-361 (2009.04.24.)"
pages = ["p181", "p389"]
status = "sourced"
[rule.value]
eligible_payer = "basic_deduction_claimant"

[[rule]]
id = "2025.education.no_claimant_payer"
year = 2025
group = "education"
summary = "맞벌이 부부: 부부 누구도 기본공제 받지 않는 가족(나이요건 미달)의 교육비는 지출한 근로자가 공제. 나이 제한 없음, 소득요건은 기본공제와 같음, 배우자·직계비속·형제자매만(직계존속 제외)"
# 근거 문장: p178·p180 "기본공제대상자(나이 제한을 받지 않음)인 배우자·직계비속·형제자매·입양자 및
# 위탁아동", p185 사례(25세 동생, 22세 처남 대학 등록금 공제), p181 예규 원천-361("근로자가 지출한 비용").
# 조문은 교육비 절의 조문을 적었다. PR 6 [기획 확인] 1번, Issue #15 정해진 결정(2026-11-19)
statute = "소법 §59의4 ③"
pages = ["p178", "p180", "p181", "p185"]
status = "sourced"
[rule.value]
claimant = "payer"
relations = ["spouse", "child", "sibling"]
checks_age = false
checks_income = true

[[rule]]
id = "2025.education.excluded_spending"
year = 2025
group = "education"
summary = "교육비 공제 대상이 아닌 지출과 빼고 계산하는 금액. 엔진은 공제 대상 지출만 받으므로 이 목록은 입력 단계(PDF 추출·도구)가 읽음"
# 근거: p44 요약, p180~p181 비과세 학자금·학자금 대출, p185·p218 사례(학원비), p186 학자금 대출
statute = "소득세법 시행령 제118조의6 제2항·제10항"
pages = ["p44", "p180", "p181", "p185", "p186", "p218"]
status = "sourced"
[rule.value]
used_by = "input_stage"

[[rule.items]]
name = "초·중·고등학생 학원비"
kind = "exclude"
pages = ["p44", "p185", "p218"]
note = "초등학교 입학연도 1~2월분은 대상"

[[rule.items]]
name = "본인 외 대학원 교육비"
kind = "exclude"
pages = ["p44", "p180"]
see = "2025.education.graduate_self_only"

[[rule.items]]
name = "비과세 학자금·장학금(사내근로복지기금, 재학 중인 학교, 직장, 국외근로공무원 자녀, 각종 단체)"
kind = "subtract"
pages = ["p180", "p181"]

[[rule.items]]
name = "직계비속 등이 학자금 대출을 받아 낸 교육비"
kind = "exclude"
pages = ["p181", "p186"]

