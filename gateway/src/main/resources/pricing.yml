# Anthropic 단가표. 단위: USD / 100만 토큰 (MTok).
# 에이전트 단가표 agent/src/taxsplit/llm/pricing.toml 과 같은 값이어야 한다.
# 출처: https://platform.claude.com/docs/en/about-claude/pricing (2026-11-12 확인)
# 두 표가 어긋나면 PricingDriftTest가 실패한다.
#
# 칸: input 기본 입력 / cache_write 캐시 쓰기(5분) / cache_read 캐시 읽기 / output 출력
#     long_prompt_threshold: 입력(캐시 읽기·쓰기 포함) 합이 이 값을 "넘으면" long_prompt 단가
# 여기에 없는 모델은 비용을 0이 아니라 빈 값(null)으로 기록한다.
claude-fable-5-2:
  input: "8"
  cache_write: "10"
  cache_read: "0.20"
  output: "40"
claude-opus-5-5:
  input: "4"
  cache_write: "5"
  cache_read: "0.20"
  output: "20"
claude-sonnet-5-5:
  input: "2"
  cache_write: "2.50"
  cache_read: "0.10"
  output: "10"
claude-haiku-5-5:
  input: "0.10"
  cache_write: "0.125"
  cache_read: "0.01"
  output: "0.50"
  long_prompt_threshold: 100000
  long_prompt:
    input: "0.50"
    cache_write: "0.625"
    cache_read: "0.05"
    output: "2.50"
