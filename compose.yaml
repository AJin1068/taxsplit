services:
  api:
    build: ./agent
    ports:
      - "127.0.0.1:8080:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # LLM 게이트웨이 (PR 16). 에이전트는 LLM_BASE_URL=http://127.0.0.1:8081 로 이쪽을 거친다
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:8081:8081"
    # 필요한 값만 넘긴다(셸 또는 .env에서). 다른 비밀값(OpenAI 키, DB 비밀번호)은 넘기지 않는다
    # .env가 없어도 뜬다 (/usage 확인용)
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GATEWAY_ANTHROPIC_BASE_URL: ${GATEWAY_ANTHROPIC_BASE_URL:-}
      GATEWAY_CALL_LOG: /app/logs/calls.jsonl
    # 호출별 비용 기록을 호스트의 gateway/logs/calls.jsonl 에 남긴다 (커밋 제외)
    volumes:
      - ./gateway/logs:/app/logs

  postgres:
    # pgvector 확장이 포함된 Postgres 17 (RAG 단계에서 사용)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    # named volume: 컨테이너를 지워도 데이터는 남음 (docker compose down -v 로만 삭제)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$: compose 변수 치환을 막고 컨테이너 안의 환경변수를 그대로 사용
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # 캐시·rate limit 전용이라 영속화 불필요
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
